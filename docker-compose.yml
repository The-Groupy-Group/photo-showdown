version: "3.8"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "donfil123!!!"
      ACCEPT_EULA: "Y"
      MSSQL_DATA_DIR: /var/opt/mssql/data
    volumes:
      - sql_data:/var/opt/mssql/data
    user: "root"
  api:
    build: ./PhotoShowdownBackend
    ports:
      - "5299:5299"
      - "${API_PORT:-8080}:8080"
      - "7222:7222"
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=db;Database=PhotoShowdownDB;User Id=sa;Password=donfil123!!!;trusted_connection=false;MultipleActiveResultSets=true;TrustServerCertificate=true;
    volumes:
      - logs:/app/Logs
      - wwwroot:/app/wwwroot
  frontend:
    build: ./photo-showdown-frontend
    ports:
      - "4200:4200"
      - "80:80"
    depends_on:
      - api

volumes:
  sql_data:
  logs:
  wwwroot:
  